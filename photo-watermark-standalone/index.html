<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Watermark | SliderApp</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --border:#334155; --primary:#6366f1; --purple:#a855f7; --text:#f8fafc; --muted:#94a3b8; }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    nav{position:fixed;inset:0 0 auto;z-index:20;height:64px;background:rgba(15,23,42,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
    .nav-inner{height:64px;max-width:1280px;margin:auto;padding:0 18px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--purple));display:grid;place-items:center}.nav-pill{padding:9px 13px;border:1px solid var(--border);background:var(--card);border-radius:9px;color:white;text-decoration:none;font-size:14px}
    main{padding:96px 16px 48px}.wrap{max-width:1050px;margin:auto}.eyebrow{font-size:13px;color:#818cf8;font-weight:600}.title{font-size:clamp(30px,5vw,42px);margin:8px 0 4px}.sub{color:var(--muted);margin:0 0 28px}.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}.drop{width:100%;min-height:170px;border:2px dashed var(--border);border-radius:14px;background:rgba(15,23,42,.7);color:var(--text);cursor:pointer;display:grid;place-items:center;text-align:center;padding:20px}.drop:hover,.drop.drag{border-color:var(--primary);background:rgba(99,102,241,.09)}.icon{width:48px;height:48px;border-radius:13px;margin:0 auto 10px;background:linear-gradient(135deg,var(--primary),var(--purple));display:grid;place-items:center;font-size:23px}.small{font-size:12px;color:var(--muted);margin-top:5px}.file{margin-top:12px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info{margin-top:16px;display:grid;gap:10px}.info div{padding:12px;border-radius:9px;background:rgba(15,23,42,.75);border:1px solid var(--border);font-size:13px}.info b{display:block;margin-top:3px;color:white}.btn{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;color:white;font-weight:700;background:linear-gradient(90deg,var(--primary),var(--purple));cursor:pointer}.btn[hidden]{display:none}.preview{min-height:430px;display:grid;place-items:center;overflow:hidden}.empty{text-align:center;color:var(--muted);max-width:320px}.preview canvas{max-width:100%;max-height:72vh;border-radius:10px;box-shadow:0 25px 55px rgba(0,0,0,.35)}input{display:none}
    @media(max-width:760px){.layout{grid-template-columns:1fr}.nav-pill{font-size:12px}.preview{min-height:320px}.card{padding:15px}}
  </style>
</head>
<body>
<nav><div class="nav-inner"><div class="brand"><div class="brand-icon">▧</div><span>SliderApp</span></div><a class="nav-pill" href="#">Photo Watermark</a></div></nav>
<main><div class="wrap"><div class="eyebrow">● Photo tools</div><h1 class="title">Photo Watermark</h1><p class="sub">Adds the XIAOMI 14T label and current timestamp to your photo.</p><div class="layout">
  <section class="card"><h3>Choose a photo</h3><button class="drop" id="drop"><span><span class="icon">▧</span><strong>Select or drop image</strong><span class="small">JPEG, PNG, WEBP and browser-supported images</span></span></button><input type="file" id="imageInput" accept="image/*"><div id="fileName" class="file" hidden></div><div class="info"><div><span class="small">BOTTOM LEFT</span><b>XIAOMI 14T</b></div><div><span class="small">BOTTOM RIGHT</span><b>Current date &amp; time</b></div></div><button class="btn" id="downloadBtn" hidden>Download Image</button></section>
  <section class="card preview"><div class="empty" id="empty"><h3>Your preview will appear here</h3><p>Everything is processed locally in your browser.</p></div><canvas id="canvas" hidden></canvas></section>
</div></div></main>
<script>
const input=document.getElementById('imageInput'),drop=document.getElementById('drop'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),download=document.getElementById('downloadBtn'),empty=document.getElementById('empty'),fileName=document.getElementById('fileName');let currentName='photo';
function stampDate(){const n=new Date(),p=v=>String(v).padStart(2,'0');return `${n.getFullYear()}.${p(n.getMonth()+1)}.${p(n.getDate())} ${p(n.getHours())}:${p(n.getMinutes())}`}
function process(file){if(!file||!file.type.startsWith('image/'))return;const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{canvas.width=img.width;canvas.height=img.height;ctx.drawImage(img,0,0);const s=Math.min(img.width,img.height),fs=Math.max(s*.025,24),pad=fs*1.2;ctx.font=`500 ${fs}px "Segoe UI",Roboto,Helvetica,sans-serif`;ctx.fillStyle='white';ctx.textBaseline='bottom';ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=4;ctx.shadowOffsetX=1;ctx.shadowOffsetY=1;ctx.textAlign='left';ctx.fillText('XIAOMI 14T',pad,canvas.height-pad);ctx.textAlign='right';ctx.fillText(stampDate(),canvas.width-pad,canvas.height-pad);currentName=file.name.replace(/\.[^/.]+$/,'');canvas.hidden=false;empty.hidden=true;download.hidden=false;fileName.hidden=false;fileName.textContent=file.name};img.src=e.target.result};r.readAsDataURL(file)}
drop.onclick=()=>input.click();input.onchange=e=>process(e.target.files[0]);['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>process(e.dataTransfer.files[0]));download.onclick=()=>{const a=document.createElement('a');a.download=`${currentName}_watermarked.jpg`;a.href=canvas.toDataURL('image/jpeg',.95);a.click()};
</script>
</body></html>
